                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Monitor' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /monitors/{id}:
    delete:
      tags: [Reviews]
      summary: Delete a monitoring log entry
      description: Restricted to `admin`, or the `coordinator` who logged it. Returns no body.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Deleted — no content }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /questions:
