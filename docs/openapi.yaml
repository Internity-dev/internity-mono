      description: >
        Restricted to `admin`/`coordinator`. Returns raw
        `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet` bytes as an
        attachment (`students.xlsx`), **not** the JSON envelope.
      parameters:
        - name: department_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Student roster workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422':
          description: Missing/invalid `department_id`
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /exports/presence:
