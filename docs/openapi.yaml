        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /reviews:
    post:
      tags: [Reviews]
      summary: Submit a review
      description: >
        Targets exactly one of `reviewee_user_id` (a mentor rating a student, or vice versa)
        or `reviewee_company_id` (an aggregate company rating) — enforced by both a DB check
        constraint and app-level validation. `rating` is 1-5.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
