  # ============================= CONTENT ==============================
  /news:
    get:
      tags: [Content]
      summary: List published news (public)
      description: No authentication required. Only `published` articles are returned.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/NewsPublicSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of published news
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/News' } } }
    post:
      tags: [Content]
      summary: Create a news article
      description: Restricted to `admin`/`coordinator`, scoped to their school/department. `publish` controls whether it's created as `draft` or `published`.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNewsRequest' }
            example: { scope_type: "school", scope_id: 1, title: "New Partnership with Acme Corp", content: "We're excited to announce...", publish: true }
      responses:
        '201':
          description: News created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/News' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /news/manage:
    get:
      tags: [Content]
      summary: List news for management (drafts and published, optionally scoped)
      parameters:
        - name: scope_type
          in: query
          required: false
          schema: { type: string, enum: [school, department] }
        - name: scope_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/NewsManagedSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of news (all statuses, scope-checked)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/News' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
  /news/{id}:
    get:
      tags: [Content]
      summary: Get a published news article by slug (public)
      description: >
        No authentication required. **Note:** despite the shared `/news/{id}` path shown here,
        this operation resolves the path segment as the article's **slug** (string), not its
        numeric ID — see `PUT`/`DELETE` below which use the numeric ID instead.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The article's URL slug, e.g. `new-partnership-with-acme-corp`.
          schema: { type: string }
      responses:
        '200':
          description: The news article
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/News' } }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Content]
      summary: Update a news article
      description: Partial update, by numeric ID. Restricted to `admin`/`coordinator` scoped to the article's school/department.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNewsRequest' }
      responses:
        '200':
          description: News updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/News' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Content]
      summary: Delete a news article
      description: By numeric ID. Restricted to `admin`/`coordinator` scoped to the article's school/department. Returns no body.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Deleted — no content }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /faqs:
    get:
      tags: [Content]
      summary: List all FAQs (public)
      description: No authentication required. Not paginated.
      security: []
      responses:
        '200':
          description: All FAQs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/FAQ' } } }
    post:
      tags: [Content]
      summary: Create a FAQ entry
      description: Restricted to `admin`.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFAQRequest' }
      responses:
        '201':
          description: FAQ created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/FAQ' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /faqs/{id}:
    put:
      tags: [Content]
      summary: Update a FAQ entry
      description: Partial update. Restricted to `admin`.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFAQRequest' }
      responses:
        '200':
          description: FAQ updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/FAQ' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Content]
      summary: Delete a FAQ entry
      description: Restricted to `admin`. Returns no body.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Deleted — no content }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ============================= REVIEWS ==============================
  /monitors:
    get:
      tags: [Reviews]
      summary: List coordinator site-visit monitoring logs
      description: Restricted to `coordinator`/`admin`; a coordinator sees only their own school's logs.
      parameters:
        - name: student_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: company_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DateSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of monitoring visits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Monitor' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Reviews]
      summary: Log a site-visit monitoring entry
      description: Restricted to `coordinator`/`admin`. `match_rating` is 1-4.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMonitorRequest' }
      responses:
        '201':
          description: Monitoring visit logged
          content:
            application/json:
              schema:
                allOf:
