  # ============================ VACANCIES ============================
  /vacancies:
    get:
      tags: [Vacancies]
      summary: List vacancies
      parameters:
        - name: company_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: department_id
          in: query
          required: false
          description: Filter to vacancies posted by companies associated with a department.
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/VacancySort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of vacancies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Vacancy' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
    post:
      tags: [Vacancies]
      summary: Create a vacancy
      description: >
        Restricted to a role that can manage the target company (`admin`, the `mentor`
        belonging to that company, or a `coordinator` scoped to its school). `slots` defaults
        to 1 if omitted or less than 1; new vacancies always start `open`.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVacancyRequest' }
            example: { company_id: 12, name: "Frontend Intern", category: "Software Engineering", slots: 3 }
      responses:
        '201':
          description: Vacancy created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Vacancy' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /vacancies/status-counts:
    get:
      tags: [Vacancies]
      summary: Vacancy counts grouped by status
      description: >
        Restricted to `admin`. Backs the admin dashboard's status-breakdown chart. Every known
        status (`open`, `closed`) is present in the result even at zero. Cached in Redis for 60s.
      responses:
        '200':
          description: Counts by status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { open: { type: integer }, closed: { type: integer } }
              example: { success: true, message: "OK", meta: {}, data: { open: 11, closed: 3 } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /vacancies/{id}:
    get:
      tags: [Vacancies]
      summary: Get a vacancy by ID
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: The vacancy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Vacancy' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Vacancies]
      summary: Update a vacancy
      description: Partial update, including opening/closing it via `status`. Restricted to a role that can manage this vacancy's company.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacancyPatch' }
      responses:
        '200':
          description: Vacancy updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Vacancy' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Vacancies]
      summary: Delete a vacancy
      description: Restricted to a role that can manage this vacancy's company. Returns no body.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Deleted — no content }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /vacancies/{id}/save:
    post:
      tags: [Vacancies]
      summary: Bookmark a vacancy
      description: Restricted to `student`.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Vacancy saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, data: null, message: "Vacancy saved", meta: {} }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { description: Already saved, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    delete:
      tags: [Vacancies]
      summary: Remove a bookmarked vacancy
      description: Restricted to `student`. Returns no body.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Removed — no content }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /vacancies/{id}/appliances:
    get:
      tags: [Vacancies]
      summary: List appliances submitted against a vacancy
      description: Restricted to a role that can manage this vacancy's company.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ApplianceSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of appliances for this vacancy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Appliance' } } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /saved-vacancies:
    get:
      tags: [Vacancies]
      summary: List the current user's bookmarked vacancies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/VacancySort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of saved vacancies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/SavedVacancy' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
  /appliances:
    get:
      tags: [Vacancies]
      summary: List the current user's own appliances
      description: Restricted to `student` — returns only the caller's own applications.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ApplianceSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of the caller's appliances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Appliance' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Vacancies]
      summary: Apply to a vacancy
      description: >
        Restricted to `student`. The vacancy must be `open` and belong to the same department
        as the applicant (`409 CONFLICT` otherwise). Creates an appliance in `pending` status.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyRequest' }
            example: { vacancy_id: 42, message: "I'd love to work on your mobile team." }
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Appliance' } }
              example:
                success: true
                message: "Application submitted"
                meta: {}
                data: { id: 501, user_id: "b3c1e2a0-...", vacancy_id: 42, status: "pending", message: "I'd love to work on your mobile team.", created_at: "2026-08-22T03:00:00Z", updated_at: "2026-08-22T03:00:00Z" }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403':
          description: Caller is not a student, has no department on record, or the vacancy is not available to their department
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: The vacancy is no longer open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, data: null, message: "This vacancy is no longer open", error: { code: "CONFLICT" }, meta: {} }
        '422': { $ref: '#/components/responses/ValidationError' }
  /appliances/status-counts:
    get:
      tags: [Vacancies]
      summary: Appliance counts grouped by status
      description: >
        Restricted to `admin`. Backs the admin dashboard's status-breakdown chart. Every known
        status is present in the result even at zero, unscoped across all schools. Cached in
        Redis for 60s. A correctly school-scoped version for coordinators isn't implemented yet.
      responses:
        '200':
          description: Counts by status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pending: { type: integer }
                          processed: { type: integer }
                          accepted: { type: integer }
                          rejected: { type: integer }
                          canceled: { type: integer }
              example: { success: true, message: "OK", meta: {}, data: { pending: 38, processed: 37, accepted: 113, rejected: 37, canceled: 25 } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /appliances/{id}/cancel:
    put:
      tags: [Vacancies]
      summary: Cancel an appliance
      description: Only the student who submitted the appliance may cancel it. Must currently be `pending` or `processed`.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Application canceled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Appliance' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Appliance is already in a terminal state (accepted/rejected/canceled)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /appliances/{id}/process:
    put:
      tags: [Vacancies]
      summary: Mark an appliance as under review
      description: Restricted to a role that can manage the appliance's vacancy's company. Must currently be `pending`.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Application marked as under review
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Appliance' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Invalid state transition
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /appliances/{id}/accept:
    put:
      tags: [Vacancies]
      summary: Accept an appliance
      description: >
        Restricted to a role that can manage the appliance's vacancy's company. Must be
        transitionable to `accepted` (from `pending` or `processed`), **and** the vacancy must
        still have a free slot — `accepted_count < vacancy.slots`, checked at accept time, not
        reserved in advance. On success, hands off to the internship module to create an
        unscheduled `intern_dates` placement row for the student.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Application accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Appliance' } }
              example:
                success: true
                message: "Application accepted"
                meta: {}
                data: { id: 501, user_id: "b3c1e2a0-...", vacancy_id: 42, status: "accepted", message: null, created_at: "2026-08-22T03:00:00Z", updated_at: "2026-08-22T04:00:00Z" }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Invalid state transition, or no slots remaining for this vacancy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, data: null, message: "No slots remaining for this vacancy", error: { code: "CONFLICT" }, meta: {} }
  /appliances/{id}/reject:
    put:
      tags: [Vacancies]
      summary: Reject an appliance
      description: >
        Restricted to a role that can manage the appliance's vacancy's company. Must be
        transitionable to `rejected` (from `pending` or `processed`). Rejected is terminal — no
        further transitions or cleanup are needed.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Application rejected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Appliance' } }
              example:
                success: true
                message: "Application rejected"
                meta: {}
                data: { id: 501, user_id: "b3c1e2a0-...", vacancy_id: 42, status: "rejected", message: null, created_at: "2026-08-22T03:00:00Z", updated_at: "2026-08-22T04:00:00Z" }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Invalid state transition
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  # =========================== INTERNSHIP ============================
  /internships/mine:
    get:
      tags: [Internship]
      summary: List the current user's own internship placements
      responses:
        '200':
          description: The caller's intern-date placements (not paginated)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/InternDate' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
  /internships/{id}:
    get:
      tags: [Internship]
      summary: Get an internship placement by ID
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: The placement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/InternDate' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /internships/{id}/dates:
    put:
      tags: [Internship]
      summary: Set/extend the schedule for a placement
      description: >
        Sets `start_date`/`end_date` (and optionally `extended_until`). Uses **optimistic
        locking**: the caller must pass the placement's current `expected_version` (from a
        prior GET), which is compared against the stored `version` — a mismatch means someone
        else modified the row first, and the request is rejected with `409 CONFLICT` rather
        than silently overwriting. The placement must not already be `completed`, `start_date`
        must be before `end_date`, and the new range must not overlap another placement for
        the same student.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetDatesRequest' }
            example: { start_date: "2026-09-01", end_date: "2026-11-30", expected_version: 1 }
      responses:
        '200':
          description: Dates updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/InternDate' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: >
            Placement already completed, the version doesn't match the current row (someone
            else updated it first — reload and retry), or the new range overlaps another
            placement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, data: null, message: "This record was changed by someone else — please reload and try again", error: { code: "CONFLICT" }, meta: {} }
        '422': { $ref: '#/components/responses/ValidationError' }
  /internships/{id}/complete:
    put:
      tags: [Internship]
      summary: Mark a placement completed
      description: Uses the placement's current version internally for the optimistic-lock write; must not already be `completed`.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Placement marked completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/InternDate' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Already completed, or was concurrently modified
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /internships/{id}/attendance-summary:
    get:
      tags: [Internship]
      summary: Get a day-by-day attendance summary for a placement's month
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - name: month
          in: query
          required: false
          description: Month to summarize, `YYYY-MM`. Defaults to the current month.
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          example: "2026-09"
      responses:
        '200':
          description: One entry per day in the requested month
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/AttendanceDay' } } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422':
          description: Invalid `month` format
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /presence-statuses:
