      description: >
        `user_id` defaults to the caller. Returns raw
        `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet` bytes as an
        attachment (`presence-{company_id}.xlsx`), **not** the JSON envelope.
      parameters:
        - name: user_id
          in: query
          required: false
          description: Defaults to the caller's own ID.
          schema: { type: string, format: uuid }
        - name: company_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Presence log workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
