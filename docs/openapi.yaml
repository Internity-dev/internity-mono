  /notifications:
    get:
      tags: [Notifications]
      summary: List the current user's notifications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/NotificationSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated notifications plus the unread count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/NotificationListData' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
  /notifications/mark-as-read:
    put:
      tags: [Notifications]
      summary: Mark all of the current user's notifications as read
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, data: null, message: "All notifications marked as read", meta: {} }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  # ============================== HEALTH ==============================
  /healthz:
    servers:
      - url: http://localhost:8080
        description: Root server — outside the /api/v1 prefix.
    get:
      tags: [Health]
      summary: Liveness check
      description: Always returns 200 if the process is up. No envelope, no auth.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: ok } }
  /readyz:
    servers:
      - url: http://localhost:8080
        description: Root server — outside the /api/v1 prefix.
    get:
      tags: [Health]
      summary: Readiness check
      description: Pings Postgres and Redis. No envelope, no auth.
      security: []
      responses:
        '200':
          description: All dependencies healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  checks: { type: object, properties: { postgres: { type: string, example: ok }, redis: { type: string, example: ok } } }
        '503':
          description: One or more dependencies unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: degraded }
                  checks: { type: object, properties: { postgres: { type: string, example: down }, redis: { type: string, example: ok } } }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: internity_session
      description: >
        HttpOnly session cookie set by /auth/login, /auth/register, or /auth/refresh.
        Mutating requests additionally require the X-CSRF-Token header — see the CSRFToken parameter.

  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      description: Numeric resource ID.
      schema: { type: integer, format: int64, minimum: 1 }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: >
        Must equal the current value of the non-httpOnly `internity_csrf` cookie
        (double-submit CSRF pattern). Required on every mutating (POST/PUT/PATCH/DELETE)
        authenticated request.
      schema: { type: string }
    Page:
      name: page
      in: query
      required: false
      description: Page number, 1-indexed. Invalid/omitted values fall back to 1.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Invalid/omitted values fall back to 20; capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      required: false
      description: Free-text search filter (resource-specific fields).
      schema: { type: string }
    Order:
      name: order
      in: query
      required: false
      description: Sort direction. Invalid/omitted values fall back to `desc`.
      schema: { type: string, enum: [asc, desc], default: desc }
    OrgSort:
      name: sort
      in: query
      required: false
      description: Column to sort by. Invalid values fall back to `name`.
      schema: { type: string, enum: [name, created_at, updated_at], default: name }
    VacancySort:
      name: sort
      in: query
      required: false
      description: Column to sort by. Invalid values fall back to `created_at`.
      schema: { type: string, enum: [name, created_at, updated_at], default: created_at }
    ApplianceSort:
      name: sort
      in: query
      required: false
      description: Column to sort by. Invalid values fall back to `created_at`.
      schema: { type: string, enum: [created_at, updated_at, status], default: created_at }
    UserSort:
      name: sort
      in: query
      required: false
      description: Column to sort by. Invalid values fall back to `created_at`.
      schema: { type: string, enum: [name, email, created_at], default: created_at }
    DateSort:
      name: sort
      in: query
      required: false
      description: Column to sort by. Invalid values fall back to `date`.
      schema: { type: string, enum: [date, created_at], default: date }
    NewsPublicSort:
      name: sort
      in: query
      required: false
      description: Column to sort by. Invalid values fall back to `published_at`.
      schema: { type: string, enum: [title, created_at, published_at], default: published_at }
    NewsManagedSort:
      name: sort
      in: query
      required: false
      description: Column to sort by. Invalid values fall back to `created_at`.
      schema: { type: string, enum: [title, created_at, published_at], default: created_at }
    NotificationSort:
      name: sort
      in: query
      required: false
      description: Column to sort by.
      schema: { type: string, enum: [created_at], default: created_at }

  responses:
    BadRequestError:
      description: Malformed request (unparseable JSON body, or a path/query param of the wrong type)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, data: null, message: "Invalid request", error: { code: "BAD_REQUEST", details: [{ field: "id", issue: "must be a positive integer" }] }, meta: {} }
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, data: null, message: "Validation failed", error: { code: "VALIDATION_ERROR", details: [{ field: "email", issue: "email" }] }, meta: {} }
    UnauthenticatedError:
      description: Missing, invalid, or expired session cookie
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, data: null, message: "Not authenticated", error: { code: "UNAUTHENTICATED" }, meta: {} }
    ForbiddenError:
      description: Authenticated, but not permitted to perform this action (role/scope check failed, or missing/invalid X-CSRF-Token)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, data: null, message: "You do not have permission to do that", error: { code: "FORBIDDEN" }, meta: {} }
    NotFoundError:
      description: Resource does not exist (or is outside the caller's scope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, data: null, message: "Not found", error: { code: "NOT_FOUND" }, meta: {} }
    ConflictError:
      description: The request conflicts with the resource's current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    # ---------- Envelope ----------
    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer, format: int64 }
    Meta:
      type: object
      properties:
        request_id: { type: string }
        pagination:
          anyOf:
            - $ref: '#/components/schemas/Pagination'
            - type: "null"
    SuccessEnvelope:
      type: object
      required: [success, data, message]
      description: The success shape every non-binary endpoint returns, with `data` typed per-endpoint via `allOf` where documented.
      properties:
        success: { type: boolean, const: true }
        data: {}
        message: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorCode:
      type: string
      enum: [BAD_REQUEST, VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, INTERNAL_ERROR]
    ErrorDetail:
      type: object
      required: [issue]
      properties:
        field: { type: string }
        issue: { type: string }
    ErrorEnvelope:
      type: object
      required: [success, data, message, error]
      properties:
        success: { type: boolean, const: false }
        data: { type: "null" }
        message: { type: string }
        error:
          type: object
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            details: { type: array, items: { $ref: '#/components/schemas/ErrorDetail' } }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------- Identity ----------
    UserResponse:
      type: object
      required: [id, role, name, email, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [admin, coordinator, mentor, student] }
        school_id: { type: [integer, "null"], format: int64 }
        department_id: { type: [integer, "null"], format: int64 }
        company_id: { type: [integer, "null"], format: int64 }
        course_id: { type: [integer, "null"], format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        nis: { type: [string, "null"], description: Student ID number. }
        gender: { type: [string, "null"], enum: [male, female, null] }
        bio: { type: [string, "null"] }
        address: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        date_of_birth: { type: [string, "null"], format: date-time }
        avatar_key: { type: [string, "null"], description: Object storage key for the avatar image. }
        resume_key: { type: [string, "null"], description: Object storage key for the uploaded resume. }
        skills: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    UserWrapper:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/UserResponse' }
    InviteCode:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        course_id: { type: integer, format: int64 }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation, invite_code]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        password_confirmation: { type: string }
        invite_code: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, password, password_confirmation]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 72 }
        password_confirmation: { type: string }
    CreateInviteCodeRequest:
      type: object
      required: [course_id]
      properties:
        course_id: { type: integer, format: int64 }
        expires_at: { type: [string, "null"], format: date-time }
    ChangeProfileRequest:
      type: object
      description: All fields optional — omitted fields are left unchanged.
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        bio: { type: string }
        address: { type: string }
        phone: { type: string, maxLength: 50 }
        gender: { type: string, enum: [male, female] }
        date_of_birth: { type: string, format: date, example: "2005-03-12" }
        skills: { type: string }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }
        new_password_confirmation: { type: string }

    # ---------- Organizations ----------
    School:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
        website: { type: [string, "null"], format: uri }
        logo_key: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateSchoolRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 50 }
        address: { type: string }
        website: { type: string, format: uri }
    SchoolPatch:
      type: object
      description: All fields optional.
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 50 }
        address: { type: string }
        website: { type: string, format: uri }
    Department:
      type: object
      properties:
        id: { type: integer, format: int64 }
        school_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, "null"] }
        study_program: { type: [string, "null"] }
        logo_key: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDepartmentRequest:
      type: object
      required: [school_id, name]
      properties:
        school_id: { type: integer, format: int64 }
        name: { type: string, minLength: 2, maxLength: 255 }
        description: { type: string }
        study_program: { type: string, maxLength: 255 }
    DepartmentPatch:
      type: object
      description: All fields optional.
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        description: { type: string }
        study_program: { type: string, maxLength: 255 }
        is_active: { type: boolean }
    Course:
      type: object
      properties:
        id: { type: integer, format: int64 }
        department_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateCourseRequest:
      type: object
      required: [department_id, name]
      properties:
        department_id: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }
    CoursePatch:
      type: object
      description: All fields optional.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }
        is_active: { type: boolean }
    Company:
      type: object
      properties:
        id: { type: integer, format: int64 }
        department_id: { type: integer, format: int64 }
        name: { type: string }
        category: { type: [string, "null"] }
        city: { type: [string, "null"] }
        state: { type: [string, "null"] }
        country: { type: [string, "null"] }
        address: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        website: { type: [string, "null"], format: uri }
        logo_key: { type: [string, "null"] }
        contact_person: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateCompanyRequest:
      type: object
      required: [department_id, name]
      properties:
        department_id: { type: integer, format: int64 }
        name: { type: string, minLength: 2, maxLength: 255 }
        category: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 255 }
        state: { type: string, maxLength: 255 }
        country: { type: string, maxLength: 255 }
        address: { type: string }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 50 }
        website: { type: string, format: uri }
        contact_person: { type: string, maxLength: 255 }
    CompanyPatch:
      type: object
      description: All fields optional.
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        category: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 255 }
        state: { type: string, maxLength: 255 }
        country: { type: string, maxLength: 255 }
        address: { type: string }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 50 }
        website: { type: string, format: uri }
        contact_person: { type: string, maxLength: 255 }
        is_active: { type: boolean }

    # ---------- Vacancies ----------
    Vacancy:
      type: object
      properties:
        id: { type: integer, format: int64 }
        company_id: { type: integer, format: int64 }
        name: { type: string }
        category: { type: [string, "null"] }
        description: { type: [string, "null"] }
        skills: { type: [string, "null"] }
        slots: { type: integer, minimum: 1 }
        status: { type: string, enum: [open, closed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateVacancyRequest:
      type: object
      required: [company_id, name]
      properties:
        company_id: { type: integer, format: int64 }
        name: { type: string, minLength: 2, maxLength: 255 }
        category: { type: string, maxLength: 255 }
        description: { type: string }
        skills: { type: string, description: Free-text, comma-separated skill list. }
        slots: { type: integer, minimum: 1, default: 1, description: Defaults to 1 if omitted or less than 1. }
    VacancyPatch:
      type: object
      description: All fields optional.
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        category: { type: string, maxLength: 255 }
        description: { type: string }
        skills: { type: string }
        slots: { type: integer, minimum: 1 }
        status: { type: string, enum: [open, closed] }
    SavedVacancy:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        vacancy_id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    Appliance:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        vacancy_id: { type: integer, format: int64 }
        status: { type: string, enum: [pending, processed, accepted, rejected, canceled] }
        message: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApplyRequest:
      type: object
      required: [vacancy_id]
      properties:
        vacancy_id: { type: integer, format: int64 }
        message: { type: string, maxLength: 2000 }

    # ---------- Internship ----------
    InternDate:
      type: object
      description: >
        Created (with null dates — "accepted, unscheduled") the moment an appliance is
        accepted. Whether a scheduled placement is "currently active" is derived from
        start/end at read time, not stored — only the explicit scheduled->completed
        transition is persisted in `status`.
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        company_id: { type: integer, format: int64 }
        appliance_id: { type: integer, format: int64 }
        start_date: { type: [string, "null"], format: date-time }
        end_date: { type: [string, "null"], format: date-time }
        extended_until: { type: [string, "null"], format: date-time, description: "If set, overrides end_date as the effective end of the placement." }
        status: { type: string, enum: [scheduled, completed] }
        version: { type: integer, description: Optimistic-locking version; required as `expected_version` on writes. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SetDatesRequest:
      type: object
      required: [start_date, end_date, expected_version]
      properties:
        start_date: { type: string, format: date, example: "2026-09-01" }
        end_date: { type: string, format: date, example: "2026-11-30" }
        extended_until: { type: string, format: date }
        expected_version: { type: integer, description: Must match the placement's current `version`, or the write is rejected with 409 CONFLICT. }
    PresenceStatus:
      type: object
      properties:
        id: { type: integer, format: int64 }
        school_id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [present, permitted, sick, absent, holiday] }
        description: { type: [string, "null"] }
        color: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreatePresenceStatusRequest:
      type: object
      required: [school_id, name, kind]
      properties:
        school_id: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [present, permitted, sick, absent, holiday] }
        description: { type: string }
        color: { type: string, maxLength: 20 }
        icon: { type: string, maxLength: 50 }
    PresenceStatusPatch:
      type: object
      description: All fields optional.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string }
        color: { type: string, maxLength: 20 }
        icon: { type: string, maxLength: 50 }
        is_active: { type: boolean }
    Presence:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        company_id: { type: integer, format: int64 }
        presence_status_id: { type: integer, format: int64 }
        date: { type: string, format: date-time }
        check_in_at: { type: [string, "null"], format: date-time }
        check_out_at: { type: [string, "null"], format: date-time }
        check_in_lat: { type: [number, "null"] }
        check_in_lng: { type: [number, "null"] }
        attachment_key: { type: [string, "null"] }
        is_approved: { type: boolean }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CheckOutRequest:
      type: object
      required: [company_id]
      properties:
        company_id: { type: integer, format: int64 }
    BulkApproveRequest:
      type: object
      required: [company_id, ids]
      properties:
        company_id: { type: integer, format: int64 }
        ids: { type: array, items: { type: integer, format: int64 }, minItems: 1 }
    ApprovedCountData:
      type: object
      properties:
        approved_count: { type: integer }
    Journal:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        company_id: { type: integer, format: int64 }
        date: { type: string, format: date-time }
        work_type: { type: [string, "null"] }
        description: { type: [string, "null"] }
        is_approved: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JournalRequest:
      type: object
      required: [company_id, date, work_type, description]
      properties:
        company_id: { type: integer, format: int64 }
        date: { type: string, format: date, example: "2026-09-10" }
        work_type: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, minLength: 1 }
    AttendanceDay:
      type: object
      properties:
        date: { type: string, format: date-time }
        status: { type: string, enum: [reported, missing, upcoming, outside_range] }
        presence: { $ref: '#/components/schemas/Presence' }

    # ---------- Scoring ----------
    Score:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        company_id: { type: integer, format: int64 }
        name: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        type: { type: string, enum: [teknis, non-teknis] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateScoreRequest:
      type: object
      required: [user_id, company_id, name, type]
      properties:
        user_id: { type: string, format: uuid }
        company_id: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 255 }
        score: { type: integer, minimum: 0, maximum: 100, default: 0 }
        type: { type: string, enum: [teknis, non-teknis] }
    ScorePatch:
      type: object
      description: All fields optional.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        score: { type: integer, minimum: 0, maximum: 100 }
        type: { type: string, enum: [teknis, non-teknis] }
    ScorePredicate:
      type: object
      properties:
        id: { type: integer, format: int64 }
        school_id: { type: integer, format: int64 }
        name: { type: string, description: "Letter grade / label, e.g. \"A\"." }
        description: { type: [string, "null"] }
        color: { type: [string, "null"] }
        min: { type: number }
        max: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateScorePredicateRequest:
      type: object
      required: [school_id, name]
      properties:
        school_id: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string }
        color: { type: string, maxLength: 20 }
        min: { type: number }
        max: { type: number }
    ScorePredicatePatch:
      type: object
      description: All fields optional.
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string }
        color: { type: string, maxLength: 20 }
        min: { type: number }
        max: { type: number }

    # ---------- Content ----------
    News:
      type: object
      properties:
        id: { type: integer, format: int64 }
        author_id: { type: string, format: uuid }
        scope_type: { type: string, enum: [school, department] }
        scope_id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        content: { type: string }
        image_key: { type: [string, "null"] }
        status: { type: string, enum: [draft, published] }
        published_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateNewsRequest:
      type: object
      required: [scope_type, scope_id, title, content]
      properties:
        scope_type: { type: string, enum: [school, department] }
        scope_id: { type: integer, format: int64 }
        title: { type: string, minLength: 2, maxLength: 255 }
        content: { type: string, minLength: 1 }
        image_key: { type: string }
        publish: { type: boolean, default: false, description: "If true, created as `published` (and `published_at` set); otherwise `draft`." }
    UpdateNewsRequest:
      type: object
      description: All fields optional.
      properties:
        title: { type: string, minLength: 2, maxLength: 255 }
        content: { type: string }
        image_key: { type: string }
        publish: { type: boolean }
    FAQ:
      type: object
      properties:
        id: { type: integer, format: int64 }
        question: { type: string }
        answer: { type: string }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateFAQRequest:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1 }
        answer: { type: string, minLength: 1 }
        sort_order: { type: integer, default: 0 }
    UpdateFAQRequest:
      type: object
      description: All fields optional.
      properties:
        question: { type: string }
        answer: { type: string }
        sort_order: { type: integer }

    # ---------- Reviews ----------
    Monitor:
      type: object
      properties:
        id: { type: integer, format: int64 }
        coordinator_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        company_id: { type: integer, format: int64 }
        date: { type: string, format: date-time }
        attachment_key: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        suggest: { type: [string, "null"] }
        match_rating: { type: integer, minimum: 1, maximum: 4 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateMonitorRequest:
      type: object
      required: [student_id, company_id, date]
      properties:
        student_id: { type: string, format: uuid }
        company_id: { type: integer, format: int64 }
        date: { type: string, format: date, example: "2026-09-15" }
        attachment_key: { type: string }
        notes: { type: string }
        suggest: { type: string }
        match_rating: { type: integer, minimum: 1, maximum: 4, default: 0 }
    Question:
      type: object
      properties:
        id: { type: integer, format: int64 }
        school_id: { type: integer, format: int64 }
        question: { type: string }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateQuestionRequest:
      type: object
      required: [school_id, question]
      properties:
        school_id: { type: integer, format: int64 }
        question: { type: string, minLength: 1 }
        sort_order: { type: integer, default: 0 }
    UpdateQuestionRequest:
      type: object
      description: All fields optional.
      properties:
        question: { type: string }
        sort_order: { type: integer }
    Review:
      type: object
      description: Targets exactly one of `reviewee_user_id` / `reviewee_company_id`.
      properties:
        id: { type: integer, format: int64 }
        reviewer_id: { type: string, format: uuid }
        question_id: { type: [integer, "null"], format: int64 }
        reviewee_user_id: { type: [string, "null"], format: uuid }
        reviewee_company_id: { type: [integer, "null"], format: int64 }
        title: { type: [string, "null"] }
        body: { type: [string, "null"] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateReviewRequest:
      type: object
      required: [reviewee_type]
      properties:
        reviewee_type: { type: string, enum: [user, company] }
        reviewee_user_id: { type: string, format: uuid, description: Required when reviewee_type is "user". }
        reviewee_company_id: { type: integer, format: int64, description: Required when reviewee_type is "company". }
        question_id: { type: integer, format: int64 }
        title: { type: string, maxLength: 255 }
        body: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5, default: 0 }
    ReviewListWithAverage:
      type: object
      properties:
        reviews: { type: array, items: { $ref: '#/components/schemas/Review' } }
        average_rating: { type: number }

    # ---------- Notifications ----------
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    NotificationListData:
      type: object
      properties:
        notifications: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        unread_count: { type: integer }
