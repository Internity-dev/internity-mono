          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Question' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '422':
