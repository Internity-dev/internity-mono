openapi: 3.1.0
info:
  title: Internity API
  version: 1.0.0
  description: |
    Internity is a school internship (PKL — Praktik Kerja Lapangan) management system.
    It coordinates the full lifecycle of a student's internship: browsing and applying to
    company-posted vacancies, the accept/reject workflow, day-to-day attendance and journal
    tracking once placed, mentor/coordinator scoring, certificate generation, coordinator
    site-visit monitoring, company/mentor reviews, and school/department/company/course
    org-structure administration.

    ## Response envelope
    Every JSON response (except binary downloads, see below) uses one consistent envelope.

    Success:
    ```json
    { "success": true, "data": { ... }, "message": "OK", "meta": { "request_id": "...", "pagination": null } }
    ```

    Error:
    ```json
    { "success": false, "data": null, "message": "...", "error": { "code": "VALIDATION_ERROR", "details": [] }, "meta": { "request_id": "..." } }
    ```

    `error.code` is one of `BAD_REQUEST` (400), `VALIDATION_ERROR` (422), `UNAUTHENTICATED` (401),
    `FORBIDDEN` (403), `NOT_FOUND` (404), `CONFLICT` (409), `RATE_LIMITED` (429), `INTERNAL_ERROR` (500).

    A small number of endpoints intentionally return **no body at all** — `204 No Content`
    (every `DELETE`, plus unsave-vacancy) — these are called out explicitly rather than
    documented as an empty envelope. Certificate and export endpoints stream raw
    `application/pdf` / `.xlsx` bytes, not the envelope.

    ## Authentication
    Sessions are cookie-based: a successful login/register/refresh sets an httpOnly
    `internity_session` cookie (short-lived access token) and an httpOnly `internity_refresh`
    cookie (scoped to `/api/v1/auth/refresh`). Every authenticated endpoint below requires the
    `internity_session` cookie.

    ## CSRF
    Login/register also set a **non-httpOnly** `internity_csrf` cookie so the frontend JS can
    read it. Every mutating request (`POST`/`PUT`/`PATCH`/`DELETE`) on an authenticated route
    must echo that cookie's value back as the `X-CSRF-Token` header (double-submit pattern) —
    a cross-site request can trigger the cookie to be sent automatically, but cannot read its
    value to forge the header. Requests missing or mismatching this header receive
    `403 FORBIDDEN`. Endpoints that only require this header are marked below.
  contact:
    name: Internity API
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Auth
    description: Session login/registration/refresh, profile, password, avatar, and invite codes.
  - name: Organizations
    description: The School -> Department -> Course/Company hierarchy.
  - name: Users
    description: The cross-school user directory (admin/coordinator only) and RBAC status-breakdown analytics.
  - name: Vacancies
    description: Company-posted internship vacancies, saved vacancies, and the appliance (application) state machine.
  - name: Internship
    description: The placement lifecycle after an appliance is accepted — dates, presence/attendance, and journals.
  - name: Scoring
    description: Mentor/coordinator scores, per-school score-predicate bands, and certificate generation.
  - name: Content
    description: News announcements and FAQs, with a public read surface.
  - name: Reviews
    description: Coordinator site-visit monitoring logs, review questionnaire templates, and mentor/student/company reviews.
  - name: Reporting
    description: Excel export endpoints.
  - name: Notifications
    description: The in-app notification inbox.
  - name: Health
    description: Infrastructure health checks (outside the `/api/v1` prefix, no envelope).
security:
  - cookieAuth: []
paths:
  # ============================== AUTH ==============================
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: >
        Public endpoint — no cookie required. On success, sets the `internity_session`,
        `internity_refresh`, and `internity_csrf` cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: "student@example.sch.id", password: "correct-horse-battery" }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/UserWrapper' } }
              example:
                success: true
                message: "Login successful"
                meta: { request_id: "b1f2..." }
                data:
                  user: { id: "b3c1e2a0-...", role: "student", name: "Ayu Lestari", email: "student@example.sch.id", is_active: true, created_at: "2026-01-10T02:00:00Z" }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, data: null, message: "Invalid email or password", error: { code: "UNAUTHENTICATED" }, meta: {} }
        '403':
          description: Account deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/register:
    post:
      tags: [Auth]
      summary: Self-register a new student account via invite code
      description: >
        Public endpoint. Resolves the invite code to a course (which implies department +
        school), creates a `student` account, and immediately logs the user in (sets the same
        three cookies as `/auth/login`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              name: "Ayu Lestari"
              email: "ayu@example.sch.id"
              password: "correct-horse-battery"
              password_confirmation: "correct-horse-battery"
              invite_code: "SMK-2026-XA"
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/UserWrapper' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: Validation failed (password mismatch, or invite code invalid/expired)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the session using the refresh cookie
      description: >
        Public endpoint (reads the `internity_refresh` cookie itself, not the CSRF/session
        cookie). Reuse of an already-rotated refresh token is treated as theft evidence and
        revokes every session in that token family, forcing a full re-login.
      security: []
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/UserWrapper' } }
        '401':
          description: Missing, invalid, or reused/expired refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, data: null, message: "Session expired, please log in again", error: { code: "UNAUTHENTICATED" }, meta: {} }
        '403':
          description: Account deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: >
        Public endpoint. Always returns 200 with a generic message regardless of whether the
        email is registered, to avoid leaking account existence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: Generic acknowledgement (email may or may not exist)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, data: null, message: "If that email is registered, a reset link has been sent", meta: {} }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a reset token
      description: Public endpoint. The token is the one emailed by `/auth/forgot-password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password reset — client should log in again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, data: null, message: "Password reset. Please log in again.", meta: {} }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '422':
          description: Password confirmation mismatch, or token invalid/expired/already used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out and clear session cookies
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Logged out (idempotent — succeeds even if the session was already invalid)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, data: null, message: "Logged out", meta: {} }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/UserWrapper' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
  /change-profile:
    put:
      tags: [Auth]
      summary: Update the current user's profile fields
      description: Partial update — every field is optional; omitted fields are left unchanged.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeProfileRequest' }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/UserWrapper' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /change-password:
    put:
      tags: [Auth]
      summary: Change the current user's password
      description: On success, clears session cookies — the client must log in again.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed — client should log in again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, data: null, message: "Password changed. Please log in again.", meta: {} }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422':
          description: Password confirmation mismatch, or current password incorrect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /avatars:
    post:
      tags: [Auth]
      summary: Upload/replace the current user's avatar
      description: Image only, max 5 MiB (enforced server-side).
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary, description: Image file, max 5 MiB. }
      responses:
        '200':
          description: Avatar updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/UserWrapper' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422':
          description: Missing file, or file is not a valid/allowed image, or exceeds size limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /invite-codes:
    post:
      tags: [Auth]
      summary: Create a student self-registration invite code
      description: >
        Restricted to `admin` (any course) or `coordinator` (only a course within their own
        school).
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteCodeRequest' }
      responses:
        '201':
          description: Invite code created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/InviteCode' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422':
          description: Course not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ========================== USERS ==========================
  /users:
    get:
      tags: [Users]
      summary: List users
      description: >
        Restricted to `admin` (sees every school) and `coordinator` (forced to their own
        `school_id` regardless of the `school_id` query param — this covers coordinators and
        students at that school; mentors, being scoped by `company_id` rather than `school_id`,
        are not yet included in a coordinator's view here). `mentor` and `student` get `403`.
        Never returns `password_hash`.
      parameters:
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [admin, coordinator, mentor, student] }
        - name: school_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: department_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: company_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/UserSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/UserResponse' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  # ========================== ORGANIZATIONS ==========================
  /schools:
    get:
      tags: [Organizations]
      summary: List schools
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/OrgSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of schools
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/School' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
    post:
      tags: [Organizations]
      summary: Create a school
      description: Restricted to `admin`.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSchoolRequest' }
      responses:
        '201':
          description: School created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/School' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /schools/{id}:
    get:
      tags: [Organizations]
      summary: Get a school by ID
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: The school
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/School' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Organizations]
      summary: Update a school
      description: >
        Partial update. Restricted to `admin`, or a `coordinator` scoped to this school.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolPatch' }
      responses:
        '200':
          description: School updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/School' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Organizations]
      summary: Delete a school
      description: Restricted to `admin`. Returns no body.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Deleted — no content }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /departments:
    get:
      tags: [Organizations]
      summary: List departments
      parameters:
        - name: school_id
          in: query
          required: false
          description: Filter to a specific school.
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/OrgSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of departments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Department' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
    post:
      tags: [Organizations]
      summary: Create a department
      description: Restricted to `admin`, or a `coordinator` scoped to the target school.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDepartmentRequest' }
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Department' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /departments/{id}:
    get:
      tags: [Organizations]
      summary: Get a department by ID
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: The department
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Department' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Organizations]
      summary: Update a department
      description: Partial update. Restricted to `admin`, or a `coordinator` scoped to this department's school.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentPatch' }
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Department' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Organizations]
      summary: Delete a department
      description: Restricted to `admin`, or a `coordinator` scoped to this department's school. Returns no body.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Deleted — no content }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /courses:
    get:
      tags: [Organizations]
      summary: List courses
      parameters:
        - name: department_id
          in: query
          required: false
          description: Filter to a specific department.
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/OrgSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of courses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Course' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
    post:
      tags: [Organizations]
      summary: Create a course
      description: Restricted to `admin`, or a `coordinator`/`mentor` scoped to the target department's school.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCourseRequest' }
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Course' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /courses/{id}:
    get:
      tags: [Organizations]
      summary: Get a course by ID
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
