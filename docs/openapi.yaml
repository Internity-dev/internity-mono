                    properties: { data: { type: array, items: { $ref: '#/components/schemas/PresenceStatus' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '422':
          description: Missing/invalid `school_id`
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      tags: [Internship]
      summary: Create a presence status
      description: A school-scoped, configurable attendance category (e.g. "Present", "Sick", "Holiday") used by check-in/excuse/journal flows.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePresenceStatusRequest' }
      responses:
        '201':
          description: Presence status created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/PresenceStatus' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /presence-statuses/{id}:
    put:
      tags: [Internship]
      summary: Update a presence status
