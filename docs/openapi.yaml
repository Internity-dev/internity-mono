  /presences:
    get:
      tags: [Internship]
      summary: List the current user's own presence records at a company
      parameters:
        - name: company_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DateSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated presence records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Presence' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '422':
          description: Missing/invalid `company_id`
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /presences/status-counts:
    get:
      tags: [Internship]
      summary: Presence counts grouped by kind
      description: >
        Restricted to `admin`. Backs the admin dashboard's attendance-breakdown chart. Defaults
        to the current calendar month (presences is the fastest-growing table in the schema, so
        an unbounded all-time query would only get slower); pass `from`/`to` for a different
        period. Every known kind is present in the result even at zero, unscoped across all
        schools. Cached in Redis for 60s (per date range).
      parameters:
        - name: from
          in: query
          required: false
          description: 'Inclusive range start, `YYYY-MM-DD`. Defaults to the 1st of the current month.'
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: 'Inclusive range end, `YYYY-MM-DD`. Defaults to today.'
          schema: { type: string, format: date }
      responses:
        '200':
          description: Counts by kind
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          present: { type: integer }
                          permitted: { type: integer }
                          sick: { type: integer }
                          absent: { type: integer }
                          holiday: { type: integer }
              example: { success: true, message: "OK", meta: {}, data: { present: 664, permitted: 102, sick: 92, absent: 87, holiday: 0 } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /presences/pending-approval:
    get:
      tags: [Internship]
      summary: List presence records at a company awaiting mentor/coordinator approval
      description: Restricted to mentor/coordinator/admin roles able to manage this company.
      parameters:
        - name: company_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DateSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated unapproved presence records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Presence' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422':
          description: Missing/invalid `company_id`
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /presences/check-in:
    post:
      tags: [Internship]
      summary: Check in for today at a company
      description: >
        Restricted to `student`. The placement at this company must be currently active
        (today within its scheduled range) and the school must have a "present" presence
        status configured, or this fails with `409 CONFLICT`. Creates today's presence row
        on the fly — rows are never pre-materialized for future days. Only one check-in per
        day is allowed (a second attempt on the same day is `409 CONFLICT`).
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [company_id]
              properties:
                company_id: { type: integer, format: int64 }
                lat: { type: number, description: Optional check-in latitude. }
                lng: { type: number, description: Optional check-in longitude. }
                photo: { type: string, format: binary, description: Optional check-in selfie/photo (image only). }
      responses:
        '201':
          description: Checked in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Presence' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409':
          description: Placement not currently active, school has no "present" status configured, or already checked in today
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, data: null, message: "You've already reported attendance for today", error: { code: "CONFLICT" }, meta: {} }
        '422':
          description: Missing/invalid `company_id`, or photo failed image validation
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /presences/check-out:
    post:
      tags: [Internship]
      summary: Check out for today at a company
      description: Restricted to `student`. Must have already checked in today, and not already checked out.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckOutRequest' }
      responses:
        '200':
          description: Checked out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Presence' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409':
          description: Not checked in yet today, or already checked out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, data: null, message: "Check in before checking out", error: { code: "CONFLICT" }, meta: {} }
        '422': { $ref: '#/components/responses/ValidationError' }
  /presences/excuse:
    post:
      tags: [Internship]
      summary: File a permitted/sick excuse for a date
      description: >
        Restricted to `student`. `kind` must be `permitted` or `sick` (not any other
        presence-status kind). The date must fall within the placement's active range, and the
        school must have that kind of presence status configured. Creates the presence row for
        that date on the fly; one record per date (a second submission for the same date is
        `409 CONFLICT`).
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [company_id, date, kind, description]
              properties:
                company_id: { type: integer, format: int64 }
                date: { type: string, format: date, example: "2026-09-10" }
                kind: { type: string, enum: [permitted, sick] }
                description: { type: string }
                attachment: { type: string, format: binary, description: Optional supporting document (image or PDF). }
      responses:
        '201':
          description: Excuse submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Presence' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409':
          description: Date outside the placement's active range, school has no matching status configured, or a record for that date already exists
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422':
          description: Missing/invalid fields, or attachment failed file validation
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /presences/{id}/approve:
    put:
      tags: [Internship]
      summary: Approve a single presence record
      description: Restricted to mentor/coordinator/admin roles able to manage the record's company.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Presence approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Presence' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /presences/bulk-approve:
    put:
      tags: [Internship]
      summary: Approve multiple presence records at once
      description: Restricted to mentor/coordinator/admin roles able to manage the given company.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkApproveRequest' }
            example: { company_id: 12, ids: [201, 202, 203] }
      responses:
        '200':
          description: Presences approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/ApprovedCountData' } }
              example: { success: true, message: "Presences approved", meta: {}, data: { approved_count: 3 } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /journals:
    get:
      tags: [Internship]
      summary: List the current user's own journal entries at a company
      parameters:
        - name: company_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DateSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated journal entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Journal' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '422':
          description: Missing/invalid `company_id`
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      tags: [Internship]
      summary: Create or update today's/a day's journal entry
      description: >
        Restricted to `student`. Upserts by `(user, company, date)` — calling it again for the
        same date edits that day's entry, on the fly, rather than requiring a separate create
        vs update call. The student must have checked in that day, and an already-approved
        entry can no longer be edited (`409 CONFLICT`).
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalRequest' }
            example: { company_id: 12, date: "2026-09-10", work_type: "Bug fixing", description: "Fixed the login race condition in the mobile app." }
      responses:
        '200':
          description: Journal saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Journal' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409':
          description: No check-in on record for that day, or the entry is already approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, data: null, message: "You can only journal a day you checked in", error: { code: "CONFLICT" }, meta: {} }
        '422': { $ref: '#/components/responses/ValidationError' }
  /journals/pending-approval:
    get:
      tags: [Internship]
      summary: List journal entries at a company awaiting mentor/coordinator approval
      description: Restricted to mentor/coordinator/admin roles able to manage this company.
      parameters:
        - name: company_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DateSort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated unapproved journal entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Journal' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422':
          description: Missing/invalid `company_id`
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /journals/{id}/approve:
    put:
      tags: [Internship]
      summary: Approve a single journal entry
      description: >
        Restricted to mentor/coordinator/admin roles able to manage the entry's company. The
        entry must be filled in (both `work_type` and `description` non-empty) — an
        entry with a check-in but no journal content yet cannot be approved.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Journal approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Journal' } }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Entry isn't filled in yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, data: null, message: "This journal entry isn't filled in yet", error: { code: "CONFLICT" }, meta: {} }
  /journals/bulk-approve:
    put:
      tags: [Internship]
      summary: Approve multiple journal entries at once
      description: Restricted to mentor/coordinator/admin roles able to manage the given company.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkApproveRequest' }
      responses:
        '200':
          description: Journals approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/ApprovedCountData' } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ============================= SCORING =============================
  /scores:
    get:
      tags: [Scoring]
      summary: List a student's scores at a company
      description: Defaults `user_id` to the caller when omitted (so a student can read their own scores without knowing their own ID).
      parameters:
        - name: user_id
          in: query
          required: false
          description: Defaults to the caller's own ID.
          schema: { type: string, format: uuid }
        - name: company_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Scores (not paginated)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Score' } } }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422':
          description: Missing/invalid `company_id`
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      tags: [Scoring]
      summary: Record a score
      description: Restricted to a role that can manage the target company (typically a mentor). `type` is `teknis` (technical) or `non-teknis`.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScoreRequest' }
      responses:
        '201':
          description: Score recorded
          content:
