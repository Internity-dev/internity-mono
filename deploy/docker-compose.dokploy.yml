name: internity

# Dokploy-specific variant of docker-compose.prod.yml. The differences from
# that file are all Dokploy platform conventions, not app changes:
#   - every service joins the shared `dokploy-network` Dokploy's own Traefik
#     instance already listens on, instead of each service getting its own
#     default bridge network — this is what lets Traefik reach api/dashboard/
#     landing directly by container port, and lets those containers still
#     resolve postgres/redis/minio by service name.
#   - api/dashboard/landing use `expose` (documents the container port,
#     publishes nothing to the host) instead of `ports:` — Dokploy's Domains
#     tab routes a public hostname straight to a container port over
#     dokploy-network, so a host port mapping would be redundant and would
#     also fight with other projects on the same Dokploy server for that
#     port.
#   - no host ports anywhere, including postgres/redis/minio, since nothing
#     outside this compose project needs to reach them directly.
# See docs/dokploy.md for the one-time server setup and per-service Domain
# configuration this file can't express on its own.

networks:
  dokploy-network:
    external: true

services:
  postgres:
    image: postgres:16-alpine
    networks: [dokploy-network]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  redis:
    image: redis:7-alpine
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    networks: [dokploy-network]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  minio-init:
    image: minio/mc:latest
    networks: [dokploy-network]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/internity-avatars local/internity-attachments local/internity-documents local/internity-logos &&
      mc anonymous set download local/internity-avatars &&
      mc anonymous set download local/internity-logos &&
      echo 'buckets ready'
      "

  migrate:
    image: migrate/migrate:v4.19.1
    networks: [dokploy-network]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - ../apps/api/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: internity-api:dokploy
    networks: [dokploy-network]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      API_PORT: "8080"
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  worker:
    image: internity-api:dokploy
    networks: [dokploy-network]
    entrypoint: ["/app/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${DASHBOARD_API_BASE_URL:?DASHBOARD_API_BASE_URL is required}
        VITE_MINIO_URL: ${DASHBOARD_MINIO_URL:?DASHBOARD_MINIO_URL is required}
    image: internity-dashboard:dokploy
    networks: [dokploy-network]
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  landing:
    build:
      context: ..
      dockerfile: apps/landing/Dockerfile.prod
      args:
        NUXT_PUBLIC_API_BASE_URL: ${LANDING_API_BASE_URL:?LANDING_API_BASE_URL is required}
        NUXT_PUBLIC_DASHBOARD_URL: ${LANDING_DASHBOARD_URL:?LANDING_DASHBOARD_URL is required}
    image: internity-landing:dokploy
    networks: [dokploy-network]
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

volumes:
  pgdata:
  miniodata:
