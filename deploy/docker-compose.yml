name: internity

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-internity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internity}
      POSTGRES_DB: ${POSTGRES_DB:-internity}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-internity}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-internity}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-internity123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-internity} ${MINIO_ROOT_PASSWORD:-internity123} &&
      mc mb -p local/internity-avatars local/internity-attachments local/internity-documents local/internity-logos &&
      mc anonymous set download local/internity-avatars &&
      mc anonymous set download local/internity-logos &&
      echo 'buckets ready'
      "

  migrate:
    image: migrate/migrate:latest
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - ../apps/api/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER:-internity}:${POSTGRES_PASSWORD:-internity}@postgres:5432/${POSTGRES_DB:-internity}?sslmode=disable",
        "up",
      ]

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: internity-api:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      API_PORT: "8080"
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:${DASHBOARD_PORT:-5173},http://localhost:${LANDING_PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-internity}:${POSTGRES_PASSWORD:-internity}@postgres:5432/${POSTGRES_DB:-internity}?sslmode=disable
      REDIS_URL: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-internity}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-internity123}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    image: internity-api:local
    entrypoint: ["/app/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-internity}:${POSTGRES_PASSWORD:-internity}@postgres:5432/${POSTGRES_DB:-internity}?sslmode=disable
      REDIS_URL: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-internity}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-internity123}

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    volumes:
      - ../apps/dashboard/src:/repo/apps/dashboard/src
      - ../packages/design-tokens:/repo/packages/design-tokens
    depends_on:
      api:
        condition: service_healthy

  landing:
    build:
      context: ..
      dockerfile: apps/landing/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8080}/api/v1
    ports:
      - "${LANDING_PORT:-3000}:3000"
    volumes:
      - ../apps/landing/app:/repo/apps/landing/app
      - ../packages/design-tokens:/repo/packages/design-tokens
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
