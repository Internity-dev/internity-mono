server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Nuxt's static preset prerenders every crawled route to its own
    # index.html plus a 200.html fallback for anything it didn't crawl.
    location / {
        try_files $uri $uri.html $uri/index.html /200.html;
    }

    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
